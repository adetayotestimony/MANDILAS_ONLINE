<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My account - MANDILAS ONLINE</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/site.css"><link rel="icon" href="/assets/favicon.png"><link rel="apple-touch-icon" href="/assets/favicon.png"><meta name="theme-color" content="#0b0b0a"><meta name="robots" content="noindex,nofollow"></head><body><div class="wrap" style="max-width:860px" id="app"></div>
<script src="/assets/site.js"></script><script>
header();let ME=null,ORDERS=[];const next=new URLSearchParams(location.search).get('next');
function loginView(step='email',email=''){ $('#app').innerHTML=`<h1>Sign in</h1><p class="muted">No password needed. We'll email you a 6-digit code.</p><div class="card" style="max-width:420px">
 ${step==='email'?`<label>Email</label><input id="e" type="email" placeholder="you@email.com" value="${esc(email)}"><label>Your name (new here? optional)</label><input id="n"><button class="btn" id="send">Email me a code</button>`
 :`<p class="muted">Code sent to <b>${esc(email)}</b>. Check your inbox (and spam).</p><label>6-digit code</label><input id="c" inputmode="numeric" maxlength="6"><button class="btn" id="ver">Verify</button> <button class="btn ghost" id="back">Change email</button>`}<p class="muted" id="msg"></p></div>`;
 const msg=t=>$('#msg').textContent=t;
 if(step==='email'){$('#send').onclick=async()=>{const e=$('#e').value.trim();window._nm=$('#n').value.trim();$('#send').disabled=true;try{await post('/api/auth/request-otp',{email:e});loginView('code',e)}catch(x){msg(x.message);$('#send').disabled=false}}}
 else{$('#ver').onclick=async()=>{try{await post('/api/auth/verify-otp',{email,code:$('#c').value.trim(),name:window._nm||''});if(next&&next.startsWith('/'))location.href=next;else boot()}catch(x){msg(x.message)}};$('#back').onclick=()=>loginView('email',email)}}
const TABS=[['orders','My orders'],['wishlist','Wishlist'],['profile','Profile'],['support','Returns & support']];
function shell(tab){$('#app').innerHTML=`<h1>Hi ${esc(ME.name||'there')}</h1><div class="tabs">${TABS.map(t=>`<button class="tab ${t[0]===tab?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div><div id="pane"></div>`;
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{location.hash=b.dataset.t;show(b.dataset.t)})}
async function show(tab){shell(tab);const p=$('#pane');
 if(tab==='orders'){ORDERS=await api('/api/me/orders');p.innerHTML=ORDERS.length?ORDERS.map(o=>`<div class="card"><div class="row"><div><b class="mono">${esc(o.reference)}</b><br><span class="muted">${new Date(o.created_at*1000).toLocaleDateString()}</span></div><div style="text-align:right"><span class="chip ${o.status}">${LABEL[o.status]}</span><br><span class="price">${fmt(o.total)}</span></div></div><p class="muted">${itemsHTML(o)}</p><details><summary class="mono" style="cursor:pointer;font-size:.7rem">TRACK DELIVERY</summary>${timelineHTML(o)}<p class="muted">To: ${esc(o.address)}, ${esc(o.city)}</p></details>${o.status==='delivered'?`<button class="btn ghost sm" data-ret="${esc(o.reference)}">Request a return</button>`:''}</div>`).join(''):'<div class="card muted">No orders yet. <a href="/#shop" style="color:var(--red)">Start shopping</a></div>';
  p.querySelectorAll('[data-ret]').forEach(b=>b.onclick=()=>{window._ret=b.dataset.ret;location.hash='support';show('support')})}
 if(tab==='wishlist'){const w=await api('/api/me/wishlist');p.innerHTML=w.length?'<div class="grid">'+w.map(x=>`<div class="card"><a href="/product/${x.id}"><img src="${x.thumb||x.img}" alt="${esc(x.name)}" loading="lazy"></a><div class="b">${esc(x.name)}<div class="price">${fmt(x.price)}</div><button class="btn ghost sm" data-rm="${x.id}" style="margin-top:8px">Remove</button></div></div>`).join('')+'</div>':'<div class="card muted">Nothing saved yet. Tap the heart on any shoe.</div>';
  p.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{await post('/api/me/wishlist/'+b.dataset.rm);show('wishlist')})}
 if(tab==='profile'){p.innerHTML=`<div class="card" style="max-width:480px"><label>Email</label><input value="${esc(ME.email)}" disabled><label>Name</label><input id="pn" value="${esc(ME.name)}"><label>Phone</label><input id="pp" value="${esc(ME.phone)}"><label>Delivery address</label><input id="pa" value="${esc(ME.address)}"><label>City / State</label><input id="pc" value="${esc(ME.city)}"><label style="display:flex;gap:8px;align-items:center;text-transform:none"><input type="checkbox" id="pm" style="width:auto;margin:0" ${ME.marketing?'checked':''}> Send me news and offers</label><br><button class="btn" id="sv">Save</button> <button class="btn ghost" id="lo">Log out</button></div>`;
  $('#sv').onclick=async()=>{await put('/api/me',{name:$('#pn').value,phone:$('#pp').value,address:$('#pa').value,city:$('#pc').value,marketing:$('#pm').checked});ME=await api('/api/me');toast('Saved')};
  $('#lo').onclick=async()=>{await post('/api/auth/logout');loginView()}}
 if(tab==='support'){const os=await api('/api/me/orders'),ts=await api('/api/me/tickets');
  p.innerHTML=`<div class="card" style="max-width:560px"><label>What do you need?</label><select id="tt"><option value="support">Help with an order or the site</option><option value="return">Return an item</option></select><label>Order</label><select id="to"><option value="">(none)</option>${os.map(o=>`<option ${o.reference===window._ret?'selected':''}>${esc(o.reference)}</option>`).join('')}</select><label>Message</label><textarea id="tm" placeholder="Tell us what happened"></textarea><button class="btn" id="ts">Send</button></div>
  ${ts.map(t=>`<div class="card"><span class="chip ${t.status}">${t.status.replace('_',' ')}</span> <b>${esc(t.type)}</b> <span class="muted mono">${esc(t.order_ref)}</span><p>${esc(t.message)}</p>${t.reply?`<p class="muted"><b>Reply:</b> ${esc(t.reply)}</p>`:''}</div>`).join('')}`;
  if(window._ret)$('#tt').value='return';
  $('#ts').onclick=async()=>{try{await post('/api/me/tickets',{type:$('#tt').value,order_ref:$('#to').value,message:$('#tm').value});window._ret=null;toast('Sent. We will reply by email.');show('support')}catch(e){toast(e.message)}}}}
async function boot(){ME=await api('/api/me');if(!ME)return loginView();show((location.hash||'#orders').slice(1)||'orders')}
boot();
</script></body></html>
