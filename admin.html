<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - MANDILAS ONLINE</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/site.css"></head><body><div class="wrap" style="max-width:1200px" id="app"></div>
<script src="/assets/site.js"></script><script>
const SIZES=['38','39','40','41','42','43','44','45','46'];
const CATS=["Sneakers","New Swagger","Limited Editions","Collaborations","Corporate Shoes","Boots","Dainty Feet (Ladies Ballet)","Slides & Sandals"];
const TABS=[['overview','Overview'],['products','Products'],['inventory','Inventory'],['orders','Orders & delivery'],['customers','Customers'],['returns','Returns & refunds'],['campaigns','Email campaigns'],['discounts','Discounts']];
const fail=e=>toast(e.message||'Something went wrong');
const dt=t=>new Date(t*1000).toLocaleString();
async function gate(){const a=await api('/api/admin/me');if(a.admin)return shell(location.hash.slice(1)||'overview');
 $('#app').innerHTML=`<h1>Admin</h1><div class="card" style="max-width:380px"><label>Password</label><input id="pw" type="password"><button class="btn" id="in">Log in</button><p class="muted" id="m"></p></div>`;
 const go=async()=>{try{await post('/api/admin/login',{password:$('#pw').value});gate()}catch(e){$('#m').textContent=e.message}};$('#in').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()}}
function shell(tab){$('#app').innerHTML=`<div class="row"><h1 style="flex:3">Dashboard</h1><a class="btn ghost sm" href="/" style="flex:0 0 auto">View site</a><button class="btn ghost sm" id="lo" style="flex:0 0 auto">Log out</button></div><div class="tabs">${TABS.map(t=>`<button class="tab ${t[0]===tab?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div><div id="pane"></div>`;
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{location.hash=b.dataset.t;shell(b.dataset.t)});$('#lo').onclick=async()=>{await post('/api/admin/logout');gate()};
 ({overview,products,inventory,orders,customers,returns,campaigns,discounts})[tab]().catch(fail)}
async function overview(){const s=await api('/api/admin/stats');const max=Math.max(1,...s.days.map(d=>d.total));
 $('#pane').innerHTML=`<div class="stats">${[['Revenue',fmt(s.revenue)],['Today',fmt(s.today)],['Orders',s.orders],['To ship',s.to_ship],['Customers',s.customers],['Products',s.products],['Open requests',s.open_tickets]].map(x=>`<div class="card stat"><span class="muted mono">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>
 <div class="card"><h2>Last 7 days</h2><div class="bars">${s.days.map(d=>`<div style="height:${Math.round(d.total/max*100)}%" title="${fmt(d.total)}"><span>${d.day.slice(5)}</span></div>`).join('')}</div><br></div>
 <div class="two"><div class="card"><h2>Top sellers</h2>${s.top.map(t=>`<p>${esc(t.name)} <b class="mono">\u00d7${t.qty}</b></p>`).join('')||'<p class="muted">No sales yet.</p>'}</div>
 <div class="card"><h2>Low stock</h2>${s.low.map(t=>`<p>${esc(t.name)} <b class="mono">${t.left} left</b></p>`).join('')||'<p class="muted">All stocked up.</p>'}</div></div>`}
async function products(){const ps=await api('/api/products');
 $('#pane').innerHTML=`<div class="card"><h2>Add a shoe</h2><div class="row"><div><label>Name</label><input id="an"></div><div><label>Price (\u20A6)</label><input id="ap" type="number"></div></div><div class="row"><div><label>Category</label><select id="ac">${CATS.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div><label>Colourway</label><input id="al" placeholder="Triple Black"></div></div>
 <label>Pairs in stock per size (EU)</label><div class="row" id="asz">${SIZES.map(s=>`<div style="min-width:70px"><label>${s}</label><input type="number" min="0" value="0" data-s="${s}"></div>`).join('')}</div>
 <div class="row"><div><label>Photo</label><input id="ai" type="file" accept="image/*"></div><div><label>Video (optional)</label><input id="av" type="file" accept="video/mp4,video/webm"></div></div><button class="btn" id="add">Upload shoe</button> <span class="muted" id="am"></span></div>
 ${ps.map(p=>`<div class="card"><div class="row"><img src="${p.img}" style="max-width:70px;flex:0 0 70px;height:70px;object-fit:cover"><div style="flex:3"><input value="${esc(p.name)}" data-f="name" data-id="${p.id}"></div><div><input type="number" value="${p.price}" data-f="price" data-id="${p.id}"></div><div><input value="${esc(p.colour)}" data-f="colour" data-id="${p.id}"></div><div><select data-f="category" data-id="${p.id}">${CATS.map(c=>`<option ${c===p.category?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div style="flex:0 0 auto;min-width:0"><button class="btn sm" data-save="${p.id}">Save</button> <button class="btn ghost sm" data-del="${p.id}">Delete</button></div></div></div>`).join('')}`;
 $('#add').onclick=async()=>{const fd=new FormData(),sz={};document.querySelectorAll('#asz input').forEach(i=>sz[i.dataset.s]=+i.value||0);
  fd.append('name',$('#an').value);fd.append('price',$('#ap').value);fd.append('category',$('#ac').value);fd.append('colour',$('#al').value);fd.append('sizes',JSON.stringify(sz));
  if($('#ai').files[0])fd.append('image',$('#ai').files[0]);if($('#av').files[0])fd.append('video',$('#av').files[0]);$('#am').textContent='Uploading…';
  try{await api('/api/admin/products',{method:'POST',body:fd});toast('Added');products()}catch(e){$('#am').textContent=e.message}};
 document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.save,o={};document.querySelectorAll(`[data-id="${id}"]`).forEach(i=>o[i.dataset.f]=i.value);try{await put('/api/admin/products/'+id,o);toast('Saved')}catch(e){fail(e)}});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this shoe?'))return;try{await api('/api/admin/products/'+b.dataset.del,{method:'DELETE'});products()}catch(e){fail(e)}})}
async function inventory(){const ps=await api('/api/products');
 $('#pane').innerHTML=`<div class="card scroll"><table><tr><th>Shoe</th>${SIZES.map(s=>`<th>${s}</th>`).join('')}<th>Total</th><th></th></tr>${ps.map(p=>{const t=Object.values(p.sizes).reduce((a,b)=>a+b,0);return `<tr><td>${esc(p.name)}<br><span class="muted">${esc(p.colour)}</span></td>${SIZES.map(s=>`<td><input type="number" min="0" style="width:58px;margin:0" value="${p.sizes[s]}" data-p="${p.id}" data-s="${s}"></td>`).join('')}<td><span class="chip ${t<=3?'cancelled':''}">${t}</span></td><td><button class="btn sm" data-sv="${p.id}">Save</button></td></tr>`}).join('')}</table></div>`;
 document.querySelectorAll('[data-sv]').forEach(b=>b.onclick=async()=>{const sz={};document.querySelectorAll(`[data-p="${b.dataset.sv}"]`).forEach(i=>sz[i.dataset.s]=+i.value||0);try{await put('/api/admin/products/'+b.dataset.sv+'/stock',{sizes:sz});toast('Stock updated');inventory()}catch(e){fail(e)}})}
async function orders(){const f=window._of||'';const os=await api('/api/admin/orders'+(f?'?status='+f:''));
 $('#pane').innerHTML=`<div class="row" style="margin-bottom:12px"><select id="flt" style="max-width:240px"><option value="">All orders</option>${Object.keys(LABEL).map(k=>`<option value="${k}" ${k===f?'selected':''}>${LABEL[k]}</option>`).join('')}</select></div>
 ${os.map(o=>`<div class="card"><div class="row"><div style="flex:3"><b class="mono">${esc(o.reference)}</b> <span class="chip ${o.status}">${LABEL[o.status]}</span><br><span class="muted">${esc(o.name)} \u00b7 ${esc(o.phone)} \u00b7 ${esc(o.email)}<br>${esc(o.address)}, ${esc(o.city)}</span></div><div style="text-align:right"><b class="price">${fmt(o.total)}</b>${o.discount?`<br><span class="muted">code ${esc(o.discount_code)} \u2212${fmt(o.discount)}</span>`:''}<br><span class="muted">${dt(o.created_at)}</span></div></div><p class="muted">${itemsHTML(o)}</p>
 <details><summary class="mono" style="cursor:pointer;font-size:.7rem">MANAGE</summary><div class="row" style="margin-top:12px"><div><label>Delivery status</label><select data-st="${o.reference}">${Object.keys(LABEL).map(k=>`<option value="${k}" ${k===o.status?'selected':''}>${LABEL[k]}</option>`).join('')}</select></div><div style="flex:2"><label>Note to customer (optional)</label><input data-sn="${o.reference}"></div><div style="flex:0 0 auto;min-width:0"><button class="btn sm" data-ssv="${o.reference}">Update + email</button></div></div>
 <div class="row"><div><label>Rider name</label><input data-r="${o.reference}" data-k="rider_name" value="${esc(o.rider_name)}"></div><div><label>Rider phone</label><input data-r="${o.reference}" data-k="rider_phone" value="${esc(o.rider_phone)}"></div><div><label>Expected delivery</label><input data-r="${o.reference}" data-k="eta" value="${esc(o.eta)}" placeholder="Tomorrow, 2-5pm"></div><div><label>Tracking note</label><input data-r="${o.reference}" data-k="tracking_note" value="${esc(o.tracking_note)}"></div><div style="flex:0 0 auto;min-width:0"><button class="btn ghost sm" data-dsv="${o.reference}">Save delivery</button></div></div>
 ${o.refund_status==='refunded'?`<p class="muted">Refunded ${fmt(o.refund_amount)}</p>`:`<div class="row"><div><label>Refund amount (blank = full)</label><input type="number" data-ra="${o.reference}"></div><div style="flex:0 0 auto;min-width:0"><label style="text-transform:none"><input type="checkbox" data-rs="${o.reference}" style="width:auto;margin:0"> put pairs back in stock</label></div><div style="flex:0 0 auto;min-width:0"><button class="btn ghost sm" data-rf="${o.reference}">Refund via Paystack</button></div></div>`}</details></div>`).join('')||'<div class="card muted">No orders here.</div>'}`;
 $('#flt').onchange=e=>{window._of=e.target.value;orders()};
 const q=(a,v)=>document.querySelector(`[${a}="${v}"]`);
 document.querySelectorAll('[data-ssv]').forEach(b=>b.onclick=async()=>{const r=b.dataset.ssv;try{await put(`/api/admin/orders/${r}/status`,{status:q('data-st',r).value,note:q('data-sn',r).value});toast('Status updated, customer emailed');orders()}catch(e){fail(e)}});
 document.querySelectorAll('[data-dsv]').forEach(b=>b.onclick=async()=>{const r=b.dataset.dsv,o={};document.querySelectorAll(`[data-r="${r}"]`).forEach(i=>o[i.dataset.k]=i.value);try{await put(`/api/admin/orders/${r}/delivery`,o);toast('Delivery details saved')}catch(e){fail(e)}});
 document.querySelectorAll('[data-rf]').forEach(b=>b.onclick=async()=>{const r=b.dataset.rf;if(!confirm('Refund this order through Paystack? This cannot be undone.'))return;try{await post(`/api/admin/orders/${r}/refund`,{amount:q('data-ra',r).value,restock:q('data-rs',r).checked});toast('Refund started');orders()}catch(e){fail(e)}})}
async function customers(){const cs=await api('/api/admin/customers');
 $('#pane').innerHTML=`<div class="card scroll"><table><tr><th>Name</th><th>Email</th><th>Phone</th><th>Orders</th><th>Spent</th><th>Joined</th><th>Marketing</th></tr>${cs.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.email)}</td><td>${esc(c.phone)}</td><td>${c.orders}</td><td>${fmt(c.spent)}</td><td>${dt(c.joined)}</td><td>${c.marketing?'yes':'no'}</td></tr>`).join('')}</table>${cs.length?'':'<p class="muted">Customers appear here when they sign in with their email.</p>'}</div>`}
async function returns(){const ts=await api('/api/admin/tickets');
 $('#pane').innerHTML=`<p class="muted">Approve a return here, then issue the money back from <b>Orders &amp; delivery &rarr; Manage &rarr; Refund via Paystack</b>.</p>`+(ts.map(t=>`<div class="card"><span class="chip ${t.status}">${t.status.replace('_',' ')}</span> <b>${esc(t.type)}</b> <span class="muted mono">${esc(t.order_ref)} \u00b7 ${esc(t.email)} \u00b7 ${dt(t.created_at)}</span><p>${esc(t.message)}</p><div class="row"><div><select data-ts="${t.id}">${['open','in_review','approved','rejected','resolved'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></div><div style="flex:3"><input data-tr="${t.id}" placeholder="Reply to customer (emailed)" value="${esc(t.reply)}"></div><div style="flex:0 0 auto;min-width:0"><button class="btn sm" data-tsv="${t.id}">Save</button></div></div></div>`).join('')||'<div class="card muted">No requests yet.</div>');
 document.querySelectorAll('[data-tsv]').forEach(b=>b.onclick=async()=>{const i=b.dataset.tsv;try{await put('/api/admin/tickets/'+i,{status:document.querySelector(`[data-ts="${i}"]`).value,reply:document.querySelector(`[data-tr="${i}"]`).value});toast('Saved');returns()}catch(e){fail(e)}})}
async function campaigns(){const cs=await api('/api/admin/campaigns');
 $('#pane').innerHTML=`<div class="card" style="max-width:720px"><h2>New campaign</h2><label>Subject</label><input id="cs"><label>Message</label><textarea id="cb" style="min-height:160px" placeholder="New drop this Friday..."></textarea><p class="muted">Goes only to customers who allowed news and offers. Each email has an unsubscribe link. Gmail allows roughly 500 emails a day.</p><button class="btn ghost" id="ct">Send test to me</button> <button class="btn" id="ca">Send to all customers</button></div>
 ${cs.map(c=>`<div class="card"><b>${esc(c.subject)}</b> <span class="muted mono">${c.sent_count} sent \u00b7 ${dt(c.created_at)}</span></div>`).join('')}`;
 const send=async t=>{if(!t&&!confirm('Send this to every subscribed customer?'))return;try{const r=await post('/api/admin/campaigns',{subject:$('#cs').value,body:$('#cb').value,test:t});toast(t?'Test sent to you':'Sending to '+r.sent+' customers');if(!t)campaigns()}catch(e){fail(e)}};
 $('#ct').onclick=()=>send(true);$('#ca').onclick=()=>send(false)}
async function discounts(){const ds=await api('/api/admin/discounts');
 $('#pane').innerHTML=`<div class="card"><h2>New discount code</h2><div class="row"><div><label>Code</label><input id="dc" placeholder="WELCOME10"></div><div><label>Type</label><select id="dk"><option value="percent">Percent off</option><option value="fixed">Fixed amount off (\u20A6)</option></select></div><div><label>Value</label><input id="dv" type="number"></div><div><label>Min. spend (\u20A6)</label><input id="dm" type="number"></div><div><label>Use limit (0 = unlimited)</label><input id="dl" type="number"></div><div><label>Expires</label><input id="de" type="date"></div></div><button class="btn" id="dadd">Create code</button></div>
 <div class="card scroll"><table><tr><th>Code</th><th>Offer</th><th>Min spend</th><th>Used</th><th>Expires</th><th>Status</th><th></th></tr>${ds.map(d=>`<tr><td class="mono">${esc(d.code)}</td><td>${d.kind==='percent'?d.value+'%':fmt(d.value)}</td><td>${fmt(d.min_total)}</td><td>${d.used}${d.usage_limit?' / '+d.usage_limit:''}</td><td>${esc(d.expires||'-')}</td><td><span class="chip ${d.active?'delivered':'cancelled'}">${d.active?'active':'paused'}</span></td><td><button class="btn ghost sm" data-tg="${d.code}">${d.active?'Pause':'Resume'}</button> <button class="btn ghost sm" data-dl="${d.code}">Delete</button></td></tr>`).join('')}</table></div>`;
 $('#dadd').onclick=async()=>{try{await post('/api/admin/discounts',{code:$('#dc').value,kind:$('#dk').value,value:$('#dv').value,min_total:$('#dm').value,usage_limit:$('#dl').value,expires:$('#de').value});toast('Code created');discounts()}catch(e){fail(e)}};
 document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{await put('/api/admin/discounts/'+b.dataset.tg);discounts()});
 document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this code?')){await api('/api/admin/discounts/'+b.dataset.dl,{method:'DELETE'});discounts()}})}
gate();
</script></body></html>
